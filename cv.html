<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV - Maria Pilligua</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://cdn.rawgit.com/jpswalsh/academicons/master/css/academicons.min.css">
  <link rel="stylesheet" href="./static/bulma.min.css">
  <link href="https://fonts.cdnfonts.com/css/optima" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="icon" type="image/png" href="images/android-chrome-512x512.png">
</head>
<body>

    <nav class="navbar">
    <div class="navbar-container">
      <div class="desktop-nav">
        <a href="index.html" class="nav-logo">Maria Pilligua</a>
          <ul class="nav-menu">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="projects.html" class="nav-link">Projects</a></li>
            <li class="nav-item"><a href="honors.html" class="nav-link">Scholarships & Honors</a></li>
            <li class="nav-item"><a href="cv.html" class="nav-link active">CV</a></li>
          </ul>
      </div>
      
      <div class="mobile-nav">
        <button class="menu-toggle-btn" id="mobile-menu-trigger" aria-label="Open navigation menu">
          <i class="fa fa-ellipsis-h"></i>
        </button>
        
        <div class="apple-menu" id="apple-menu-dropdown">
          <ul>
            <li><a href="index.html">Home <i class="fa fa-home"></i></a></li>
            <li><a href="projects.html">Projects <i class="fa fa-flask"></i></a></li>
            <li><a href="honors.html">Honors <i class="fa fa-trophy"></i></a></li>
            <li><a href="cv.html">CV <i class="fa fa-file-text-o"></i></a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="page-container">
    <section class="content-section" id="cv-preview">
      <h1 class="page-title">Curriculum Vitae</h1>
      <div class="cv-toolbar">
        <a href="static/Maria_Pilligua_CV.pdf" download class="button is-info">
          <i class="fa fa-download"></i> &nbsp; Download CV
        </a>
      </div>
      <div class="cv-embed-container">
        <embed src="static/Maria_Pilligua_CV.pdf" type="application/pdf" width="100%" height="900px" />
      </div>
    </section>
  </main>

  <script>
      // script at the bottom of index.html

    const menuTrigger = document.querySelector('#mobile-menu-trigger');
    const menuDropdown = document.querySelector('#apple-menu-dropdown');

    // Toggle the menu when the "..." button is clicked
    menuTrigger.addEventListener('click', function(event) {
      event.stopPropagation(); // Prevents the window click event from firing immediately
      menuDropdown.classList.toggle('active');
    });

    // Close the menu if you click anywhere else on the page
    window.addEventListener('click', function(event) {
      if (menuDropdown.classList.contains('active')) {
        menuDropdown.classList.remove('active');
      }
    });
  </script>
</body>
</html>
