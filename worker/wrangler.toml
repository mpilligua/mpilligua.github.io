name = "ask-maria"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Secrets (set once with wrangler secret put NAME):
#   OPENROUTER_API_KEY   required, the OpenRouter API key
#   IP_SALT              optional, any long random string to salt visitor IP hashes
#   TELEGRAM_BOT_TOKEN   optional, bot token from @BotFather
#   TELEGRAM_CHAT_ID     optional, your Telegram chat id (send a message to
#                        the bot then curl api.telegram.org/bot<token>/getUpdates
#                        to find it). When both are set, you get a Telegram
#                        message the first time a visitor starts a new chat.

# D1 database for logging chat conversations.
# One-time setup (from ./worker):
#   wrangler d1 create ask-maria-logs
# Copy the returned database_id into the line below, then apply the schema:
#   wrangler d1 execute ask-maria-logs --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "ask-maria-logs"
database_id = "4982df33-b32a-4664-bf22-26b2d88d56eb"
